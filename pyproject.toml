[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wayquant"
version = "3.0.0"
description = "FAIR-inspired annual cyber loss simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.26.4,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["wayquant*", "app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
