services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wayquant-engine-api
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENBLAS_NUM_THREADS=4
      - OMP_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: wayquant-enterprise-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
